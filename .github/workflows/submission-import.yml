# 维护者 `/merge <commit>` 之后，把投稿的作品写进 main。
#
# 唯一的自动化写入路径：权限、提交一致性、摘要重算、登记表、单次提交都在
# scripts/ci/import-submission.mjs 里，这里只负责触发与给权限。

name: submission-import

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: issue 编号
        required: true
      commit:
        description: 已审查的 commit（7-40 位）
        required: true

permissions: {}

# 不并发：同一时间只能有一个导入在写 main
concurrency:
  group: submission-import
  cancel-in-progress: false

jobs:
  import:
    # 评论命令只认首行 `/merge <commit>`，且 issue 必须带四条 kind 标签之一。
    # workflow_dispatch 时 comment 为空，走 inputs。
    if: >-
      github.event_name == 'workflow_dispatch'
      || (startsWith(github.event.comment.body, '/merge ')
        && (contains(github.event.issue.labels.*.name, 'scene-submission')
          || contains(github.event.issue.labels.*.name, 'scene-update')
          || contains(github.event.issue.labels.*.name, 'widget-submission')
          || contains(github.event.issue.labels.*.name, 'widget-update')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 评论正文只用于解析首行的 `/merge <commit>`；其余内容不参与任何解释。
      - name: Import and commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 评论触发时 github.actor 是评论者；dispatch 时是发起人
          GITHUB_ACTOR: ${{ github.actor }}
        run: >-
          node scripts/ci/import-submission.mjs
          --issue "${{ github.event.issue.number || inputs.issue }}"
          --body "${{ github.event.comment.body || inputs.commit }}"
