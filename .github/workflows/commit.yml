name: Commit messages

# 只校验 PR 标题：本仓库只用 squash 合并，标题就是最终进入 main 的那条信息。
# 分支里的中间提交不校验——它们会被压掉，卡住反而妨碍开发。
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  message:
    name: 提交信息
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 规则与本地 .githooks/commit-msg 是同一份：scripts/check-commit.mjs
      - name: Validate title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit.mjs --message "$PR_TITLE"

      # 手动触发时没有 PR 标题，退而校验最近一次提交，避免这个工作流形同虚设
      - name: Validate last commit
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/check-commit.mjs --message "$(git log -1 --format=%s)"
