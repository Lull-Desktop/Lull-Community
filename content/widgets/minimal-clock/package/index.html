<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>极简时钟</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="clock" aria-label="传统指针时钟">
      <div class="alarm-clock" aria-hidden="true">
        <div class="handle"></div>
        <div class="bell bell-left"></div>
        <div class="bell bell-right"></div>
        <div class="hammer"></div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
        <div class="case">
          <div class="dial">
            <div class="minute-track"></div>
            <div class="hour-track"></div>
            <div class="numbers">
              <span style="--n: 1"><b>1</b></span><span style="--n: 2"><b>2</b></span>
              <span style="--n: 3"><b>3</b></span><span style="--n: 4"><b>4</b></span>
              <span style="--n: 5"><b>5</b></span><span style="--n: 6"><b>6</b></span>
              <span style="--n: 7"><b>7</b></span><span style="--n: 8"><b>8</b></span>
              <span style="--n: 9"><b>9</b></span><span style="--n: 10"><b>10</b></span>
              <span style="--n: 11"><b>11</b></span><span style="--n: 12"><b>12</b></span>
            </div>
            <div class="dial-label">LULL <span>•</span> CLOCK</div>
            <div class="dial-date" id="date"></div>
            <div class="hand hour-hand" id="hour-hand"></div>
            <div class="hand minute-hand" id="minute-hand"></div>
            <div class="hand second-hand" id="second-hand"></div>
            <div class="pin"></div>
          </div>
        </div>
      </div>
      <time class="sr-only" id="time"></time>
      <div class="window-controls" role="group" aria-label="时钟窗口控制">
        <button type="button" id="smaller" aria-label="缩小时钟" title="缩小时钟">−</button>
        <button type="button" id="larger" aria-label="放大时钟" title="放大时钟">＋</button>
        <button type="button" id="close" aria-label="关闭时钟" title="关闭时钟">×</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="./main.js" type="module"></script>
  </body>
</html>
