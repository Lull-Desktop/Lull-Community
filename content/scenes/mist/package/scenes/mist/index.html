<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>雾岚 · Lull</title>
  <style>
    :root { --x: 50%; --y: 50%; --halo: 0; --strength: 1; --play: running; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1a1c; }
    .scene { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 60% 35%, #9fb9ac55, transparent 38%), linear-gradient(170deg, #142e31 0%, #3b5a57 48%, #122a2b 100%); }
    .sun { position: absolute; top: 16%; left: 58%; width: clamp(45px, 6vw, 100px); aspect-ratio: 1; border-radius: 50%; background: #d7e6cd; opacity: .46; box-shadow: 0 0 65px 40px #d7e6cd29; filter: blur(1px); }
    .mountains { position: absolute; inset: 0; width: 100%; height: 100%; }
    .mist { position: absolute; left: -20%; width: 140%; border-radius: 50%; background: radial-gradient(ellipse, #d1e9dc55, #b3d2c821 44%, transparent 72%); filter: blur(24px); opacity: calc(.7 * var(--strength)); animation: drift 35s ease-in-out infinite alternate; animation-play-state: var(--play); }
    .mist.one { top: 42%; height: 20%; }
    .mist.two { top: 58%; height: 17%; opacity: calc(.55 * var(--strength)); animation-duration: 48s; animation-direction: alternate-reverse; }
    .mist.three { top: 70%; height: 15%; opacity: calc(.35 * var(--strength)); animation-duration: 58s; }
    .water { position: absolute; inset: 77% 0 0; background: radial-gradient(ellipse at 60% 0%, #a2c6b638, transparent 55%), repeating-linear-gradient(0deg, transparent 0 13px, #c4e0cc0d 14px, transparent 16px 30px), linear-gradient(#1d403e, #0a1c1e); }
    .light { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle 22vmax at var(--x) var(--y), #d4ffe640, #a5e5ce16 38%, transparent 72%); opacity: var(--halo); transition: opacity 1s ease; mix-blend-mode: screen; }
    .foreground { position: absolute; inset: auto 0 0; height: 32%; width: 100%; }
    .grain { position: absolute; inset: 0; opacity: .16; background-image: radial-gradient(#dcf5df 0.6px, transparent .8px); background-size: 37px 43px; mask-image: linear-gradient(transparent 24%, #000 72%); }
    .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 55% 44%, transparent 37%, #06151688 100%); }
    @keyframes drift { from { transform: translate3d(-5%, 0, 0); } to { transform: translate3d(5%, -2%, 0); } }
    @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
    [data-reduced="true"] *, [data-reduced="true"] *::after { animation: none !important; transition: none !important; }
  </style>
</head>
<body>
  <main class="scene" aria-label="薄雾在层叠的远山与湖面之间缓缓飘移">
    <div class="sun"></div>
    <svg class="mountains" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="far" x2="0" y2="1"><stop stop-color="#829c90"/><stop offset="1" stop-color="#4b6c67"/></linearGradient><linearGradient id="mid" x2="0" y2="1"><stop stop-color="#4c7770"/><stop offset="1" stop-color="#254c49"/></linearGradient><linearGradient id="near" x2="0" y2="1"><stop stop-color="#275552"/><stop offset="1" stop-color="#112e2e"/></linearGradient></defs>
      <path fill="url(#far)" d="M0 520 100 451 188 476 320 342 408 425 507 363 630 467 765 331 874 427 1001 346 1119 442 1241 340 1346 420 1440 374 1440 900 0 900Z"/>
      <path fill="#cadbcc38" d="m268 394 52-52 88 83-58-39-28-19-15 18-13-5zm443-10 54-53 109 96-68-41-33-25-20 18-13-3zm475 0 55-44 105 80-65-33-30-22-20 15-12-4z"/>
      <path fill="url(#mid)" d="M0 603 105 543 207 573 320 495 425 566 550 479 675 557 795 483 921 563 1038 488 1158 565 1283 495 1440 557 1440 900 0 900Z"/>
      <path fill="url(#near)" d="M0 681 126 620 238 661 348 598 478 668 603 612 719 669 850 606 984 668 1109 610 1231 660 1335 605 1440 650 1440 900 0 900Z"/>
    </svg>
    <div class="mist one"></div><div class="mist two"></div><div class="mist three"></div><div class="water"></div><div class="light"></div>
    <svg class="foreground" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#0a2425" d="M0 170 Q140 145 240 183 T500 222 Q690 239 870 213 T1190 190 Q1330 151 1440 166 V300 H0Z"/>
      <g fill="#092122"><path d="M0 180 14 180 14 76 0 76Zm-16-51 37-60 35 60zm4-28 33-55 31 55zm5-25 28-51 27 51z"/><path d="M85 199h8V113h-8zm-28-38 32-54 32 54zm4-24 28-51 28 51zm5-23 23-43 24 43z"/><path d="M1352 192h10V79h-10zm-36-43 41-70 41 70zm5-29 36-65 36 65zm6-27 30-57 30 57z"/><path d="M1414 177h10V54h-10zm-40-40 45-76 45 76zm5-30 40-70 40 70zm8-30 32-60 32 60z"/></g>
    </svg>
    <div class="grain"></div><div class="vignette"></div>
  </main>
  <script src="./scene.js" defer></script>
</body>
</html>
